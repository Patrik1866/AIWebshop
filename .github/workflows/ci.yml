name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-only:
    runs-on: self-hosted 

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Install Maven
        run: |
          curl -O https://downloads.apache.org/maven/maven-3/3.8.6/binaries/apache-maven-3.8.6-bin.zip
          unzip apache-maven-3.8.6-bin.zip -d ${{ runner.temp }}
          echo "MAVEN_HOME=${{ runner.temp }}/apache-maven-3.8.6" >> $GITHUB_ENV
          echo "${{ runner.temp }}/apache-maven-3.8.6/bin" >> $GITHUB_PATH

      - name: Build Backend
        run: |
          cd BackEnd
          mvn clean package -DskipTests

      - name: Build Frontend
        run: |
          cd FrontEnd
          npm install
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Build Docker Images Without Cache
        run: docker-compose build --no-cache


