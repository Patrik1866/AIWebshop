name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Build Backend
      run: |
        cd BackEnd
        mvn clean package -DskipTests
    
    - name: Build Frontend
      run: |
        cd FrontEnd
        npm install
        npm run build
    
    - name: Build Docker Compose
      run: docker-compose build
    
    - name: Run Backend Tests
      run: |
        cd BackEnd
        mvn test
    
    # Opcionális: Frontend tesztek futtatása
    - name: Run Frontend Tests
      run: |
        cd FrontEnd
        npm test