version: '3.8'

services:
  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend

  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL} 
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME} 
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
    depends_on:
      - db

  db:
    image: postgres:13
    environment:
        - POSTGRES_DB=${POSTGRES_DB} 
        - POSTGRES_USER=${POSTGRES_USER} 
        - PSOTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
  
  nginx: 
    build: 
      context: ./nginx 
      dockerfile: Dockerfile 
    ports: 
      - "80:80" 
    depends_on: 
      - frontend 
      - backend
